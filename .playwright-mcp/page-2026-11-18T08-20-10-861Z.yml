    - generic [ref=f2e319]:
      - generic [ref=f2e320]:
        - paragraph [ref=f2e321]:
          - text: I created this because
          - strong [ref=f2e322]: I myself have learnt the real value of breaks and rest
          - text: only when I had already
          - strong [ref=f2e323]: lost a lot to burnout
          - text: .
        - paragraph [ref=f2e324]:
          - text: I am someone who has always loved working, and I even worked on things that had a real purpose to them. But somewhere along the way,
          - strong [ref=f2e325]: that purpose got completely lost in the rush
          - text: I created for myself and the rush this society pushes on us.
          - strong [ref=f2e326]: I got burnt out so bad
          - text: that it made me question the choices I had once made against all the odds.
        - paragraph [ref=f2e327]:
          - text: I was this driven, passionate, working human who kept work as his top priority.
          - strong [ref=f2e328]: Work was my way of dealing with difficult times
          - text: and passing through heavy emotions, and after years of building that habit, it just kept piling up until one day
          - strong [ref=f2e329]: it completely blasted.
        - paragraph [ref=f2e330]:
          - strong [ref=f2e331]: I came to Goa because I was just completely done
          - text: with my work and this fast-paced, constantly demanding life. To be honest,
          - strong [ref=f2e332]: I didn't even know what slow living was back then
          - text: ", or how it could change someone’s outlook towards life."
        - paragraph [ref=f2e333]:
          - text: But
          - strong [ref=f2e334]: this house and these surroundings subconsciously put me into a different rhythm...
          - text: and it made me realize that my quality of life had instantly increased.
          - strong [ref=f2e335]: Being so close to nature
          - text: helped me get clear on things, and it gave my body and mind
          - strong [ref=f2e336]: a much-deserved break
          - text: only to come back stronger.
        - paragraph [ref=f2e337]:
