      - heading "Terms of Service" [level=1] [ref=f24e12]
      - paragraph [ref=f24e13]: Last updated 13 November 2026
      - paragraph [ref=f24e14]:
        - text: These Terms are a binding agreement between you and Braivex ("Clipwyn", "we", "us") for the use of the website and app at http://127.0.0.1:8770 (the "Service"). By creating an account or using the Service you accept these Terms, our
        - link "Privacy Policy" [ref=f24e15] [cursor=pointer]:
